<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaferTogether - AI Stress Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="report">
<main class="prototype-shell">
  <section class="phone">
    <div class="status-bar">
      <span>09:41</span>
      <span class="status-icons">5G 100%</span>
    </div>

    <div class="screen">
      <header class="app-header">
        <div>
          <p class="eyebrow">SAFER TOGETHER</p>
          <h1>דוח סטטיסטיקות</h1>
        </div>
      </header>

      <div class="notice warn">הדוח מציג אומדן לחץ בלבד ואינו אבחון רפואי.</div>

      <label class="report-select">
        <span class="eyebrow">בחר בן משפחה</span>
        <select class="select-field" data-report-member></select>
      </label>

      <section class="list-stack" data-report-detail></section>

      <nav class="bottom-nav" aria-label="ניווט תחתון">
        <a class="home-round" href="board.html">⌂</a>
      </nav>
    </div>

    <div class="home-indicator"></div>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SaferTogether - Create Safety Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="missions">
<main class="prototype-shell">
  <section class="phone">
    <div class="status-bar">
      <span>09:41</span>
      <span class="status-icons">5G 100%</span>
    </div>

    <div class="screen">
      <header class="app-header">
        <div>
          <p class="eyebrow">SAFER TOGETHER</p>
          <h1>יצירת משימה</h1>
        </div>
      </header>
      <p class="subtitle form-help">בחרו אילו משימות יופיעו בחדר. רק המשימות שתסמנו יהיו פעילות.</p>

      <form class="form-panel" data-mission-form>
        <div class="input-group">
          <label for="activityTitle">שם המשחק</label>
          <input class="field" id="activityTitle" name="activityTitle" data-activity-title value="חדר משימות חדש">
        </div>

        <fieldset class="task-select">
          <legend>משימות לחדר זה</legend>
          <label class="task-option"><input type="checkbox" data-task="puzzle"> משחק ערכת חירום</label>
          <label class="task-option"><input type="checkbox" data-task="code"> משחק קוד הדלת</label>
          <label class="task-option"><input type="checkbox" data-task="missile"> משחק הטילים</label>
        </fieldset>

      </form>

      <div class="button-stack">
        <button class="btn btn-primary" type="button" data-save-missions>סיום ויצירת משימה</button>
        <nav class="bottom-nav" aria-label="ניווט תחתון">
          <a class="home-round" href="board.html">⌂</a>
          <a class="settings-round" href="create-activity.html">⚙</a>
        </nav>
      </div>
    </div>

    <div class="home-indicator"></div>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<title>SaferTogether - Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="groups">
<main class="prototype-shell">
  <section class="phone">
    <div class="status-bar">
      <span>09:41</span>
      <span class="status-icons">5G 100%</span>
    </div>

    <div class="screen">
      <header class="app-header group-top-header">
        <p class="eyebrow">SAFER TOGETHER</p>
        <div class="group-title-row">
          <div class="oref-header-status oref-header-status-offline" data-oref-header-status role="status" aria-live="polite" aria-label="Pikud HaOref status">
            <span class="oref-header-icon" aria-hidden="true">
              <img class="oref-header-icon-image" src="assets/pikud-haoref.png" alt="">
            </span>
            <span class="oref-header-label">&#1508;&#1497;&#1511;&#1493;&#1491; &#1492;&#1506;&#1493;&#1512;&#1507;</span>
          </div>
          <h1>&#1492;&#1511;&#1489;&#1493;&#1510;&#1493;&#1514; &#1513;&#1500;&#1497;</h1>
          <section class="avatar-launch-panel" data-avatar-launch-panel aria-label="Avatar">
            <div data-current-avatar-summary></div>
          </section>
        </div>
      </header>

      <p class="notice hidden" data-alert-location-status aria-live="polite"></p>

      <p class="notice" data-current-user></p>

      <form class="form-panel join-team-form hidden" data-join-code-form>
        <div class="input-group">
          <label for="joinCode">&#1511;&#1493;&#1491; &#1511;&#1489;&#1493;&#1510;&#1492;</label>
          <input class="field" id="joinCode" name="code" autocomplete="off" placeholder="ABC123">
        </div>
        <button class="btn btn-secondary" type="submit">&#1513;&#1500;&#1497;&#1495;&#1514; &#1489;&#1511;&#1513;&#1492;</button>
      </form>

      <div class="hidden" data-member-group-panel>
        <div class="group-list" style="margin-bottom:0.5rem" data-member-group-display></div>
        <button class="btn" style="font-size:0.8rem;padding:0.4rem 1rem;background:transparent;border:1px solid #aaa;color:#555;margin-top:0.25rem" type="button" data-leave-group-btn>&#1506;&#1494;&#1493;&#1489; &#1511;&#1489;&#1493;&#1510;&#1492;</button>
        <p class="auth-error hidden" data-leave-group-error></p>
      </div>

      <div class="hidden" data-leave-confirm-dialog style="background:#fff;border-radius:12px;padding:1rem;margin-top:0.5rem;box-shadow:0 2px 12px rgba(0,0,0,0.12);text-align:center">
        <p style="font-size:0.95rem;margin-bottom:0.75rem">&#1492;&#1488;&#1501; &#1488;&#1514;&#1492; &#1489;&#1496;&#1493;&#1495; &#1513;&#1488;&#1514;&#1492; &#1512;&#1493;&#1510;&#1492; &#1500;&#1506;&#1494;&#1493;&#1489; &#1511;&#1489;&#1493;&#1510;&#1492; &#1494;&#1493;&#1508;</p>
        <div style="display:flex;gap:0.5rem;justify-content:center">
          <button class="btn btn-secondary" type="button" data-leave-confirm-yes>&#1499;&#1503;</button>
          <button class="btn" type="button" data-leave-confirm-no style="background:#eee;color:#333">&#1500;&#1488;</button>
        </div>
      </div>

      <section class="group-list" data-groups-list aria-label="Group list"></section>

      <a class="btn btn-primary hidden" href="create-group.html" data-admin-create-group>&#1497;&#1510;&#1497;&#1512;&#1514; &#1511;&#1489;&#1493;&#1510;&#1492; &#1495;&#1491;&#1513;&#1492;</a>

      <nav class="bottom-nav" aria-label="Bottom navigation">
        <a class="home-round" href="groups.html">&#8962;</a>
        <a class="settings-round" href="index.html" data-logout>&#8617;</a>
      </nav>
    </div>

    <div class="home-indicator"></div>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<title>SaferTogether - Stay Together Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="game">
<main class="prototype-shell">
  <section class="phone">
    <div class="status-bar">
      <span>09:41</span>
      <span class="status-icons">5G 100%</span>
    </div>

    <div class="screen activity-screen">
      <header class="app-header">
        <div>
          <p class="eyebrow">SAFER TOGETHER</p>
          <h1>פעילות מרגיעה</h1>
        </div>
        <span class="timer-chip" data-event-timer>10:00</span>
      </header>

      <section class="locked-panel hidden" data-game-locked>
        <h2>הפעילות נעולה</h2>
        <p class="subtitle">ממתינים שכל בני המשפחה יסמנו שהם מוגנים.</p>
        <a class="btn btn-secondary" href="emergency.html">חזרה לאזעקה</a>
      </section>

      <section class="question-card card hidden" data-game-unlocked>
        <button class="btn btn-secondary hidden" type="button" data-enable-motion>📱 הפעל שליטה בהטיית הטלפון</button>
        <div data-game-area></div>
      </section>
    </div>

    <div class="home-indicator"></div>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
